spring.application.name=LoanLite

# spring.datasource.url moved to profile files (application-dev.properties / application-prod.properties)
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Bean Validation (backendTodo.csv task 7) is deliberately driven ONLY by explicit @Valid at
# controller boundaries, not Hibernate's automatic validate-on-flush (which would also fire for
# partial-merge updates and internal service saves, throwing a different exception type -
# ConstraintViolationException, not MethodArgumentNotValidException - that GlobalExceptionHandler
# doesn't special-case, and would produce an uncontrolled 500 instead of a clean 400).
spring.jpa.properties.jakarta.persistence.validation.mode=none

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8080

# Document upload limits (featuresTodo.csv task 10) - explicit values instead of relying on
# Spring Boot's silent defaults (1MB/file, 10MB/request).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
