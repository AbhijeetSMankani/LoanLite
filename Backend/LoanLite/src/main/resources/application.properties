spring.application.name=LoanLite

# spring.datasource.url moved to profile files (application-dev.properties / application-prod.properties)
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8080

# Document upload limits (featuresTodo.csv task 10) - explicit values instead of relying on
# Spring Boot's silent defaults (1MB/file, 10MB/request).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
